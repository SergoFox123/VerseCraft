# Increases the amount of memory Gradle can use and optimizes the GC
    # -XX:+UseZGC
    org.gradle.jvmargs=-Xmx4G
# Helps with build times
    org.gradle.parallel=true
# Caches Dependencies for faster build times.
    org.gradle.caching=true
# Use Tiny Remapper for Mixins
    loom.mixin.useLegacyMixinAp=false

# Fabric Properties
    minecraft_version=26.2
    loader_version=0.19.3

# Mod Properties
	mod_id = versecraft
	mod_version = 6.2 Beta 3
    # protocol version must be changed after each update with dual env changes
    protocol_version = 19
	maven_group = net.sergofox123
	archives_base_name = VerseCraft

# Dependencies
    fabric_api_version=0.153.0+26.2
    frozenlib_version=2.5.2-mc26.2

# External Mods
    modmenu_version=19.0.0-alpha.1
    cloth_config_version=26.1.154

# Optimization
    sodium_version=mc26.1-0.8.7-fabric
    run_sodium = false
